name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so the latest push is what gates merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The default token needs nothing but the checkout. Declared rather than
# inherited: a repository-level default is not part of this file's review
# surface, and it can change without anything here changing.
permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the runner slim (no CUDA wheels)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run test suite
        # `network` tests download models from the HF hub; deselected here to
        # keep CI hermetic and fast. Everything else — including the torch
        # mechanism tests on locally-built models — runs offline.
        run: pytest -m "not network" -q

      - name: Viewer parser tests
        # The web viewer's .mtj parser runs under Node's built-in test runner
        # against the committed sample scenes — no npm dependencies.
        run: node --test viewer/tests/
